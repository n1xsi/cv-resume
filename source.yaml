cv:
  name: "Иван Лебедев"
  location: "Санкт-Петербург"
  phone: "+7-910-856-43-23"
  email: "vanyalebedev45@gmail.com"
  social_networks:
    - network: "Telegram"
      username: "n1xs1"
    - network: "GitHub"
      username: "n1xsi"
  sections:
    "Обо мне":
      - "Python-разработчик в AI/LLM: RAG-платформы, self-hosted инференс, обработка персональных данных, автоматизация процессов."
      - "Коммерческий опыт в Nexign (AI Group) — от пайплайна индексации и семантического поиска по корпоративной документации до сервиса анонимизации документов перед передачей в LLM."
      - "Системная база (C, ASM, Linux): понимание архитектуры ОС и низкоуровневых механизмов."
    "Опыт работы":
      - company: "Nexign"
        position: "Инженер-программист (Стажировка)"
        start_date: "2026-04"
        end_date: "2026-09"
        location: "Санкт-Петербург"
        highlights:
          - "Реализовал основную часть пайплайна индексации и семантического поиска по корпоративной документации (RAG): Qdrant и pgvector как векторные хранилища, self-hosted инференс на vLLM и Triton, собственный пайплайн без тяжёлых фреймворков."
          - "Разработал сервис обратимой анонимизации документов перед передачей в LLM: регулярные выражения и типовые валидаторы (телефон, СНИЛС, ИНН, номера карт), подстановка токенов-заглушек и корректный демаскинг в ответе модели."
          - "Перенёс генерацию тест-кейсов (ПМИ) с Python/LangChain-скриптов на полностью автоматизированный процесс в n8n — параллельная генерация, контроль покрытия, двухуровневая гарантия доставки данных. Ускорил подготовку ПМИ на ~60%, на новый процесс перевёл весь отдел."
          - "Исправил критичные баги в сервисе распознавания речи (обвязка над внешней ASR-моделью): некорректная работа со словарями и ошибки распознавания отдельных слов."
          - "Написал smoke- и unit-тесты для всех сервисов команды — проверка работоспособности и отказоустойчивости."
      - company: "FutureToday"
        position: "Python-разработчик (Практика)"
        start_date: "2025-02"
        end_date: "2025-04"
        location: "Санкт-Петербург"
        highlights:
          - "Разрабатывал и оптимизировал функционал приложения для поиска стажировок с использованием нейросетевой фильтрации."
          - "Проводил рефакторинг legacy-кода и адаптацию алгоритмов обработки данных из Excel-таблиц."
          - "Выявлял и устранял баги в модулях сбора данных из социальных сетей."
    Образование:
      - institution: "ГУАП"
        area: "Информатика и вычислительная техника (09.03.01)"
        degree: "Бак."
        start_date: "2023-09"
        end_date: "2027-06"
        location: "Санкт-Петербург"
        highlights:
          - "Участие в учебных практиках с разработкой внутренних инструментов для автоматизации."
          - "Написание научных статей на тему использования нейросетей в разработке."
    Проекты:
      - name: "[SUAI Deadline Bot](https://github.com/n1xsi/suai-deadline-bot)"
        date:
        start_date: "2025-07"
        end_date: "present"
        summary: "Телеграм-бот для автоматизации отслеживания дедлайнов студентов в личном кабинете ГУАП."
        highlights:
          - "Стек — Python, Aiogram 3.x, SQLAlchemy+SQLite, Requests, BeautifulSoup4."
          - "Реализовал автоматический парсинг данных и систему мгновенных уведомлений."
          - "Поддерживаю активную базу пользователей (одногруппники и студенты вуза)."
      - name: "[PyCustomRand](https://github.com/n1xsi/PyCustomRand)"
        date:
        start_date: "2025-11"
        end_date: "present"
        summary: "Библиотека расширенной генерации чисел, альтернатива стандартному random."
        highlights:
          - Решил проблемы недостаточной энтропии стандартного модуля `random` и специфики «банковского» округления встроенной функции `round`.
          - Обеспечил более гибкий API по сравнению со стандартом, 100% покрытие тестами (Unittest) и документацию на двух языках.
      - name: "[NightPillow](https://github.com/n1xsi/nightpillow-pyqt5)"
        date:
        start_date: "2025-08"
        end_date: "2025-09"
        summary: "Desktop-приложение для расчёта оптимального времени сна."
        highlights:
          - "Использовал PyQt5 для создания интуитивно понятного и удобного графического интерфейса."
    "Навыки и инструменты":
      - label: "Языки программирования"
        details: "Python, C, C++, Java, Assembler, SQL, Bash"
      - label: "Бэкенд и инфраструктура"
        details: "FastAPI, SQLAlchemy / SQLite, Alembic, PostgreSQL, Docker, n8n, Git, Make"
      - label: "Тестирование"
        details: "PyTest, smoke-тестирование, тестирование API (Swagger / Postman), проверка отказоустойчивости"
      - label: "Языки"
        details: "Русский (родной), Английский (B2 - Upper-Intermediate)"
    "Дополнительная информация":
      - bullet: "Soft Skills — Был капитаном киберспортивной команды (LAN-турниры), отвечал за стратегию, коммуникацию, поддержку и управление командой в стрессовых ситуациях. Участвовал в вузовских хакатонах (разработка игровых прототипов на C# и Unity)."
      - bullet: "Hard Skills — Призёр школьных олимпиад по программированию (областной уровень). Регулярно решаю алгоритмические задачи на [CodeWars](https://www.codewars.com/users/nixsi), вхожу в топ-12% мирового рейтинга (Rank: 4 kyu)."
