cv:
  name: "Иван Лебедев"
  location: "Санкт-Петербург"
  phone: "+7-910-856-43-23"
  email: "vanyalebedev45@gmail.com"
  social_networks:
    - network: "Telegram"
      username: "n1xs1"
    - network: "GitHub"
      username: "n1xsi"
  sections:
    "Опыт работы (1 год)":
      - company: "Nexign"
        position: "Python-разработчик (AI-Group)"
        start_date: "2026-04"
        end_date: "2026-09"
        highlights:
          - "Разработал RAG-пайплайн для семантического поиска по корпоративной базе (Qdrant, pgvector). Настроил self-hosted инференс LLM через vLLM и Triton."
          - "Написал сервис обратимой анонимизации документов перед передачей в LLM: регулярные выражения и типовые валидаторы (телефон, СНИЛС, ИНН, номера карт), подстановка токенов-заглушек и корректный демаскинг в ответе модели."
          - "Автоматизировал генерацию ПМИ: перевёл пайплайн с LangChain-скриптов на n8n. Ускорил подготовку тестов на 60% и масштабировал решение на весь отдел."
          - "Исправлял критичные баги в сервисе распознавания речи (обвязка над внешней ASR-моделью) и покрыл smoke/unit тестами 80% функционала."
      - company: "FutureToday"
        position: "Python-разработчик (Практика)"
        start_date: "2025-02"
        end_date: "2025-05"
        highlights:
          - "Разработка функционала поиска стажировок (нейросетевая фильтрация) и оптимизация алгоритмов обработки Excel-данных."
          - "Перевёл часть телеграм-ботов с конструкторов на Python (aiogram)."
    Образование:
      - institution: "ГУАП"
        area: "Информатика и вычислительная техника (09.03.01)"
        degree: "Бак."
        start_date: "2023-09"
        end_date: "2027-06"
        highlights:
          - "Разработка внутренних инструментов для автоматизации процессов."
          - "Написание научных статей на тему использования нейросетей в разработке."
    Проекты:
      - name: "[SUAI Deadline Bot](https://github.com/n1xsi/suai-deadline-bot)"
        date:
        summary: "Телеграм-бот для автоматизации отслеживания дедлайнов студентов в личном кабинете ГУАП."
        highlights:
          - "Стек — Python, Aiogram 3.x, SQLAlchemy+SQLite, Requests, BeautifulSoup4."
          - "Реализовал автоматический парсинг данных и систему мгновенных уведомлений."
          - "Поддерживаю активную базу пользователей (одногруппники и студенты вуза)."
      - name: "[PyCustomRand](https://github.com/n1xsi/PyCustomRand)"
        date:
        summary: "Библиотека расширенной генерации чисел, альтернатива стандартному random."
        highlights:
          - Решил проблемы недостаточной энтропии стандартного модуля `random` и специфики «банковского» округления встроенной функции `round`.
          - Обеспечил более гибкий API по сравнению со стандартом, 100% покрытие тестами (Unittest) и документацию на двух языках.
    "Навыки и инструменты":
      - label: "Языки программирования"
        details: "Python, C/C++, Java, Assembler, Bash"
      - label: "Бэкенд и инфраструктура"
        details: "FastAPI, PostgreSQL, SQLAlchemy/SQLite, Alembic, Docker, Github Actions, Git"
      - label: "AI/ML"
        details: "LLM, RAG, VectorDB (Qdrant, pgvector), n8n, OpenAI API, PyTorch, TensorFlow"
      - label: "Тестирование"
        details: "PyTest, smoke-тестирование, тестирование API (Swagger/Postman), проверка отказоустойчивости"
      - label: "Языки"
        details: "Русский (родной), Английский (B2 - Upper-Intermediate)"
