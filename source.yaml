cv:
  name: "Иван Лебедев"
  headline: "Python-разработчик — AI/LLM Engineer, Backend"
  location: "Санкт-Петербург"
  phone: "+79108564323"
  email: "vanyalebedev45@gmail.com"
  social_networks:
    - network: "Telegram"
      username: "n1xs1"
    - network: "GitHub"
      username: "n1xsi"
  sections:
    "Обо мне":
      - "Python-разработчик с 10 месяцами практического опыта: 6 месяцев коммерческой разработки в Nexign (AI-Group) и 4 месяца производственной практики. Специализация — LLM-сервисы и бэкенд к ним: RAG-поиск, self-hosted инференс, обезличивание ПДн для работы моделей в закрытом контуре."
      - "Результаты: автоматизировал подготовку ПМИ в отделе из 32 инженеров (−60% времени на комплект); вывел в прод асинхронный сервис, которым ежедневно пользуются 100+ студентов. Понимаю системный уровень (C/C++, Assembler, Linux)."
      - "Ищу роль AI/LLM Engineer или Python-backend. Студент 4 курса ГУАП, **готов к полной занятости**."
    "Опыт работы":
      - company: "Nexign"
        position: "Python-разработчик, AI-Group (Срочный контракт, команда 8 чел.)"
        start_date: "2026-04"
        end_date: "2026-09"
        highlights:
          - "Разработал RAG-пайплайн поиска по корпоративной базе (2 тыс. документов, 50 тыс. чанков): эмбеддинги (BAAI/bge-m3), векторный поиск в Qdrant и pgvector, ранжирование. FastAPI-сервис в Docker: p95 — 190 мс, recall@5 — 86%. Пользуются 240 сотрудников."
          - "Реализовал сервис обратимой анонимизации ПДн (152-ФЗ) перед отправкой в LLM: 10+ типов сущностей (телефон, СНИЛС, ИНН, номера карт) через регулярные выражения и контрольные суммы, подстановка токенов и демаскинг в ответе. Точность детекции F1=89% на тестовой выборке из 200 документов — это разблокировало работу LLM с внутренними документами."
          - "Автоматизировал генерацию ПМИ: перевёл пайплайн с LangChain-скриптов на n8n. Ускорил подготовку тестов с 40 мин. до 15 мин. (-60%); решением пользуются 32 инженера отдела."
          - "Развернул self-hosted инференс LLM (Qwen2.5-32B-Instruct, 2×NVIDIA A100 80GB) на vLLM и Triton: настроил continuous batching, квантизацию и health-checks, выжал 500+ токенов/с. Корпоративные документы перестали уходить во внешний API."
          - "Стабилизировал сервис распознавания речи (обвязка над внешней ASR-моделью): закрыл десятки критичных багов, поднял покрытие тестами с 20% до 80% (pytest, unit и smoke)."
      - company: "FutureToday"
        position: "Python-разработчик (Производственная практика, команда 3 чел.)"
        start_date: "2025-02"
        end_date: "2025-05"
        highlights:
          - "Реализовал модуль семантического поиска стажировок с фильтрацией вакансий по стеку (Python, sentence-transformers, scikit-learn). Ускорил обработку Excel-выгрузок кандидатов (файлы по 30+ тыс. строк) с 20 минут до 10 минут за счёт перехода с построчной итерации openpyxl на векторизованные операции pandas и потоковое чтение."
          - "Перевёл 4 Telegram-бота карьерных мероприятий с no-code конструкторов на собственную асинхронную реализацию (Python, aiogram, FSM): убрал зависимость от сторонних платных сервисов и связал сбор откликов напрямую с внутренней БД."
    Образование:
      - institution: "ГУАП"
        area: "Информатика и вычислительная техника (09.03.01)"
        degree: "Бак."
        start_date: "2023-09"
        end_date: "2027-06"
        highlights:
          - "Диплом и научные статьи по применению нейросетей в разработке ПО. Профильное: алгоритмы и структуры данных, базы данных, ОС, системное программирование."
    Проекты:
      - name: "[RAG Document Assistant](https://github.com/n1xsi/rag-document-assistant)"
        summary: "AI-ассистент для семантического поиска и вопросно-ответной работы по документам пользователя."
        highlights:
          - "**Стек** — Python, Sentence-Transformers, NumPy, PyPdf."
          - "Реализовал кросс-языковой векторный поиск и защиту от галлюцинаций через динамический порог релевантности. Защищён как тестовое задание в ИТ-хаб «Северстали»."
      - name: "[SUAI Deadline Bot](https://github.com/n1xsi/suai-deadline-bot)"
        summary: "Асинхронный Telegram-бот для отслеживания дедлайнов в ЛК ГУАП; 100+ активных студентов ежедневно."
        highlights:
          - "**Стек** — Python, asyncio, Aiogram 3.x, SQLAlchemy 2.0 (async), Alembic, Docker."
          - "Спроектировал схему БД и фоновый парсинг с обработкой отказов внешнего сервиса. Настроил CI/CD: тесты, сборка образа в GHCR, автодеплой на продакшен-сервер."
    "Навыки и инструменты":
      - label: "Языки программирования"
        details: "Python, SQL, Bash, C/C++, Assembler"
      - label: "Бэкенд"
        details: "FastAPI, asyncio, Pydantic, SQLAlchemy 2.0 (async), Alembic, PostgreSQL, SQLite, REST API, Swagger/OpenAPI"
      - label: "AI/LLM"
        details: "RAG, промпт-инжиниринг, эмбеддинги, чанкинг, векторные БД (Qdrant, pgvector), self-hosted инференс (vLLM, Triton), LangChain, n8n, OpenAI API, Sentence-Transformers, NumPy"
      - label: "Инфраструктура"
        details: "Docker, Docker Compose, Linux, Git, CI/CD (GitHub Actions, Jenkins), Jira, Confluence"
      - label: "Тестирование"
        details: "PyTest, unit- и smoke-тесты, тестирование API (Postman, Swagger)"
      - label: "Базовый уровень"
        details: "PyTorch, Hugging Face, Kubernetes, Nginx, Prometheus/Grafana"
      - label: "Языки"
        details: "Русский — родной, Английский — B2 (Upper-Intermediate)"
