cv:
  name: "Иван Лебедев"
  headline: "Python-разработчик — AI/LLM Engineer, Backend"
  location: "Санкт-Петербург"
  phone: "+79108564323"
  email: "vanyalebedev45@gmail.com"
  social_networks:
    - network: "Telegram"
      username: "n1xs1"
    - network: "GitHub"
      username: "n1xsi"
  sections:
    "Обо мне":
      - "Python-разработчик с упором на AI/Backend (RAG, LLM-инференс, автоматизация). Имею коммерческий опыт работы с векторными БД, оркестрацией пайплайнов (n8n) и написанием стабильного кода."
      - "Пишу асинхронные сервисы на Python (FastAPI, asyncio, SQLAlchemy 2.0, PostgreSQL), упаковываю в Docker, довожу до продакшена через CI/CD. Понимаю системный уровень (C/C++, Assembler, Linux). Студент 4 курса ГУАП, **готов к полной занятости**."
    "Опыт работы":
      - company: "Nexign"
        position: "Python-разработчик, AI-Group (Срочный контракт)"
        start_date: "2026-04"
        end_date: "2026-09"
        highlights:
          - "Разработал RAG-пайплайн поиска по корпоративной базе: чанкинг, эмбеддинги, векторный поиск в Qdrant и pgvector, ранжирование. FastAPI-сервис в Docker."
          - "Реализовал сервис обратимой анонимизации персональных данных перед отправкой в LLM: детекция телефонов, СНИЛС, ИНН, номеров карт через регулярные выражения и контрольные суммы, подстановка токенов и демаскинг в ответе модели."
          - "Автоматизировал генерацию ПМИ: перевёл пайплайн с LangChain-скриптов на n8n. Ускорил подготовку тестов на ~60% и масштабировал решение на весь отдел."
          - "Развернул self-hosted инференс LLM на vLLM и NVIDIA Triton: заменили внешний API, данные перестали покидать периметр компании."
          - "Стабилизировал сервис распознавания речи (обвязка над внешней ASR-моделью): закрыл десятки критичных багов, поднял покрытие тестами с 20% до 80% (pytest, unit и smoke)."
      - company: "FutureToday"
        position: "Python-разработчик (Практика)"
        start_date: "2025-02"
        end_date: "2025-05"
        highlights:
          - "Разработка функционала поиска стажировок с нейросетевой фильтрацией вакансий. Ускорил обработку Excel-выгрузок в ~2 раза за счёт оптимизации алгоритмов."
          - "Перевёл часть Telegram-ботов для мероприятий с no-code конструкторов на собственную реализацию (Python, aiogram)."
    Образование:
      - institution: "ГУАП"
        area: "Информатика и вычислительная техника (09.03.01)"
        degree: "Бак."
        start_date: "2023-09"
        end_date: "2027-06"
        highlights:
          - "Диплом и научные статьи по применению нейросетей в разработке ПО. Профильное: алгоритмы и структуры данных, базы данных, ОС, системное программирование."
    Проекты:
      - name: "[RAG Document Assistant](https://github.com/n1xsi/rag-document-assistant)"
        summary: "AI-ассистент для семантического поиска и вопросно-ответной работы по документам пользователя."
        highlights:
          - "**Стек** — Python, Sentence-Transformers, NumPy, PyPdf."
          - "Реализовал кросс-языковой векторный поиск и защиту от галлюцинаций через динамический порог релевантности. Защищён как тестовое задание в ИТ-хаб «Северстали»."
      - name: "[SUAI Deadline Bot](https://github.com/n1xsi/suai-deadline-bot)"
        summary: "Асинхронный Telegram-бот для отслеживания дедлайнов в ЛК ГУАП; 100+ активных студентов ежедневно."
        highlights:
          - "**Стек** — Python, asyncio, Aiogram 3.x, SQLAlchemy 2.0 (async), Alembic, Docker."
          - "Спроектировал схему БД и фоновый парсинг с обработкой отказов внешнего сервиса. Настроил CI/CD: тесты, сборка образа в GHCR, автодеплой на продакшен-сервер."
      - name: "[PyCustomRand](https://github.com/n1xsi/PyCustomRand)"
        summary: "Open-source библиотека в PyPI: генератор псевдослучайных чисел (LCG) с посевом от системного времени."
        highlights:
          - "**Стек** — Python, Pytest, GitHub Actions, PyPI."
          - "Разработал собственный LCG-алгоритм генерации с точностью до наносекунд (кучность распределения на 173% выше встроенного модуля random). Настроил CI/CD для автопубликации пакета в PyPI, 100% test coverage."
    "Навыки и инструменты":
      - label: "Языки программирования"
        details: "Python, SQL, Bash, C/C++, Assembler"
      - label: "Бэкенд"
        details: "FastAPI, asyncio, Pydantic, SQLAlchemy 2.0 (async), Alembic, PostgreSQL, SQLite, REST API, Swagger/OpenAPI"
      - label: "AI/LLM"
        details: "RAG, промпт-инжиниринг, эмбеддинги, чанкинг, векторные БД (Qdrant, pgvector), self-hosted инференс (vLLM, Triton), LangChain, n8n, OpenAI API, Sentence-Transformers, NumPy"
      - label: "Инфраструктура"
        details: "Docker, Docker Compose, Linux, Git, CI/CD (GitHub Actions, Jenkins), Jira, Confluence"
      - label: "Тестирование"
        details: "PyTest, unit- и smoke-тесты, тестирование API (Postman, Swagger)"
      - label: "Базовый уровень"
        details: "PyTorch, Hugging Face, Kubernetes, Nginx, Prometheus/Grafana"
      - label: "Языки"
        details: "Русский — родной, Английский — B2 (Upper-Intermediate)"
