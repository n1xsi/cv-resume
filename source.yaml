cv:
  name: "Иван Лебедев"
  location: "Санкт-Петербург"
  phone: "+7-910-856-43-23"
  email: "vanyalebedev45@gmail.com"
  social_networks:
    - network: "Telegram"
      username: "n1xs1"
    - network: "GitHub"
      username: "n1xsi"
  sections:
    "Обо мне":
      - "Python-разработчик с упором на AI/Backend (RAG, LLM-инференс, автоматизация). Имею коммерческий опыт работы с векторными БД, оркестрацией пайплайнов (n8n) и написанием стабильного асинхронного кода."
      - "Понимаю внутреннюю архитектуру систем (C/C++, ASM, Linux). В свободное время решаю алгоритмы на CodeWars (Rank: 4 kyu — топ-12% мира)."
    "Опыт работы":
      - company: "Nexign"
        position: "Python-разработчик (AI-Group)"
        start_date: "2026-04"
        end_date: "2026-09"
        highlights:
          - "Разработал RAG-пайплайн для семантического поиска по корпоративной базе (Qdrant, pgvector). Настроил self-hosted инференс LLM через vLLM и Triton."
          - "Реализовал сервис обратимой анонимизации документов перед передачей в LLM: регулярные выражения и типовые валидаторы (телефон, СНИЛС, ИНН, номера карт) и корректный демаскинг в ответе модели."
          - "Автоматизировал генерацию ПМИ: перевёл пайплайн с LangChain-скриптов на n8n. Ускорил подготовку тестов на 60% и масштабировал решение на весь отдел."
          - "Исправлял критичные баги в сервисе распознавания речи (обвязка над внешней ASR-моделью) и покрыл smoke/unit тестами 80% функционала."
      - company: "FutureToday"
        position: "Python-разработчик (Практика)"
        start_date: "2025-02"
        end_date: "2025-05"
        highlights:
          - "Разработка функционала поиска стажировок (нейросетевая фильтрация) и оптимизация алгоритмов обработки Excel-данных."
          - "Перевёл часть телеграм-ботов для мероприятий с конструкторов на Python (aiogram)."
    Образование:
      - institution: "ГУАП"
        area: "Информатика и вычислительная техника (09.03.01)"
        degree: "Бак."
        start_date: "2023-09"
        end_date: "2027-06"
        highlights:
          - "Дипломная работа связана с применением LLM/RAG-систем."
          - "Написание научных статей на тему использования нейросетей в разработке."
    Проекты:
      - name: "[RAG Document Assistant](https://github.com/n1xsi/rag-document-assistant)"
        summary: "AI-ассистент для семантического поиска и QA по пользовательским документам."
        highlights:
          - "**Стек** — Python, Sentence-Transformers, NumPy, PyPdf."
          - "Реализовал пайплайн с кросс-языковым векторным поиском и защитой от галлюцинаций (динамический порог релевантности). Проект был успешно защищён как тестовое задание в ИТ-хаб «Северстали»."
      - name: "[SUAI Deadline Bot](https://github.com/n1xsi/suai-deadline-bot)"
        summary: "Асинхронный Telegram-бот для автоматизации отслеживания дедлайнов в ЛК ГУАП."
        highlights:
          - "**Стек** — Python, Aiogram 3.x, SQLAlchemy 2.0 (async), Alembic, Docker."
          - "С нуля спроектировал БД и фоновый парсинг. Настроил полный цикл CI/CD (сборка в GHCR и автоматический деплой на продакшн-сервер). Ботом ежедневно пользуется 100+ студентов."
      - name: "[PyCustomRand](https://github.com/n1xsi/PyCustomRand)"
        summary: "Open-source библиотека для генерации чисел на базе системного времени."
        highlights:
          - "**Стек** — Python, Pytest, GitHub Actions, PyPI."
          - "Разработал собственный LCG-алгоритм генерации с точностью до наносекунд (кучность распределения на 173% выше встроенного модуля random). Настроил CI/CD для автопубликации пакета в PyPI, 100% test coverage."
    "Навыки и инструменты":
      - label: "Языки программирования"
        details: "Python, C/C++, Assembler, Bash"
      - label: "Бэкенд и инфраструктура"
        details: "FastAPI, PostgreSQL, SQLAlchemy/SQLite, Alembic, Docker, Github Actions, Git"
      - label: "AI/ML"
        details: "LLM, RAG, VectorDB (Qdrant, pgvector), n8n, OpenAI API, PyTorch, TensorFlow"
      - label: "Тестирование"
        details: "PyTest, smoke-тестирование, тестирование API (Swagger/Postman), проверка отказоустойчивости"
      - label: "Языки"
        details: "Русский (родной), Английский (B2 - Upper-Intermediate)"
