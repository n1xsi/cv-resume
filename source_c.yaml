cv:
  name: "Иван Лебедев"
  headline: "C/C++ Developer | Embedded & System Engineer"
  location: "Санкт-Петербург"
  phone: "+79108564323"
  email: "vanyalebedev45@gmail.com"
  social_networks:
    - network: "Telegram"
      username: "n1xs1"
    - network: "GitHub"
      username: "n1xsi"
  sections:
    "Обо мне":
      - "Инженер-разработчик (C/C++, Python) с 10 месяцами коммерческой разработки в enterprise-сегменте (Nexign, FutureToday). Специализируюсь на системной разработке, алгоритмах и высоконагруженных сервисах."
      - "Имею сильную базу: понимаю архитектуру ЭВМ, работу памяти, пишу на C и Assembler. Имею практический опыт работы с аппаратным обеспечением: ПЛИС (Verilog/VHDL), микроконтроллеры (МИК32 Амур/RISC-V)."
      - "Ищу роль C/C++ или Embedded разработчика. Студент 4 курса ГУАП, **готов к полной занятости**."
    "Опыт работы":
      - company: "Nexign"
        position: "Инженер-программист, AI-Group (Срочный контракт, команда 8 чел.)"
        start_date: "2026-04"
        end_date: "2026-09"
        highlights:
          - "Развернул и оптимизировал высоконагруженный инференс-сервер (NVIDIA Triton, vLLM) на 2×A100. Настроил continuous batching, аллокацию памяти и health-checks, обеспечив пропускную способность 500+ токенов/с."
          - "Проектировал production-сервисы в Docker с жесткими требованиями к производительности: оптимизировал пайплайны обработки данных, добившись стабильной задержки p95 — 190 мс при высоких нагрузках."
          - "Разработал систему обратимой анонимизации (152-ФЗ), используя регулярные выражения, контрольные суммы и побитовые маски для обработки потока данных перед отправкой в закрытый контур."
          - "Внедрил инженерные практики в отделе: перевел часть процессов на автоматизированные пайплайны, поднял покрытие критически важных сервисов тестами с 20% до 80% (unit, smoke)."
      - company: "FutureToday"
        position: "Backend-разработчик (Производственная практика, команда 3 чел.)"
        start_date: "2025-02"
        end_date: "2025-05"
        highlights:
          - "Ускорил обработку больших массивов данных (файлы по 30+ тыс. строк) в 2 раза за счёт перехода на векторизованные операции (NumPy/pandas, использующие под капотом C-API)."
          - "Спроектировал асинхронную логику внутренних сервисов, убрал зависимость от сторонних API, связав обработку данных напрямую с внутренней реляционной БД."
    Образование:
      - institution: "ГУАП"
        area: "Информатика и вычислительная техника (09.03.01)"
        degree: "Бак."
        start_date: "2023-09"
        end_date: "2027-06"
        highlights:
          - "Профильные дисциплины: алгоритмы и структуры данных, ОС, архитектура ЭВМ, системное программирование, программирование микроконтроллеров и разработка цифровых схем на ПЛИС."
    Проекты:
      - name: "[3D Polyhedron Rasterizer](https://github.com/n1xsi/3d-polyhedron-rasterizer) | C++, WinAPI, GDI+"
        summary: "Собственный 3D-движок с полным циклом рендеринга без использования OpenGL/DirectX."
        highlights:
          - "Написал математику аффинных преобразований. Реализовал отсечение невидимых граней и алгоритм закраски полигонов. Оптимизировал рендеринг с использованием back-face culling и Z-буфера."
      - name: "[RLE Compressor](https://github.com/n1xsi/rle-compressor) | C, File I/O, POSIX"
        summary: "Кроссплатформенная консольная утилита для сжатия файлов и директорий."
        highlights:
          - "Реализовал алгоритм Run-Length Encoding. Спроектировал бинарный формат контейнера для упаковки директорий. Оптимизировал потоковое чтение/запись байтов и ручное выделение памяти (malloc/free)."
      - name: "[x86-64 Assembly Labs](https://github.com/n1xsi/assembly-x64-labs) | GAS ASM, Linux, Makefile"
        summary: "Сборник низкоуровневых программ для демонстрации работы с процессором."
        highlights:
          - "Реализовал сложные вычисления (FPU), поразрядную обработку данных и косвенную адресацию. Интегрировал системные вызовы Linux и функции `libc`."
    "Навыки и инструменты":
      - label: "Языки программирования"
        details: "C, C++, Python, Assembler (x86-64), Verilog (VHDL), Bash"
      - label: "Embedded & Hardware"
        details: "Микроконтроллеры (МИК32 Амур / RISC-V, Arduino / AVR), ПЛИС (FPGA), MPLAB IDE, Arduino IDE, Vivado, Linux (Kali/WSL), POSIX"
      - label: "Инфраструктура"
        details: "CMake, Make, Docker, Git, CI/CD (GitHub Actions), GDB, IDA x64, Neovim"
      - label: "Языки"
        details: "Русский — родной, Английский — B2 (Upper-Intermediate)"
